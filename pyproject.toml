[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carnet"
version = "0.9.5"
description = "Four-layer memory provider for Hermes: permanent core, facts recalled on demand, sheets read only when needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

# The default backend talks to LM Studio and needs nothing beyond the stdlib.
# The `sidecar` backend runs sidecar/embed_server.py in a separate interpreter and
# needs these two packages there. Hermes installs the declared dependencies when
# the plugin is admitted; install the extra for that fallback:
#   pip install "carnet[sidecar]"
[project.optional-dependencies]
sidecar = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "tokenizers>=0.20,<1",
]

[tool.setuptools]
packages = ["carnet"]
package-dir = { carnet = "." }

[tool.setuptools.package-data]
carnet = [
  "plugin.yaml",
  "locales/*.yaml",
  "dashboard/*",
  "desktop/*",
  "sidecar/embed_server.py",
]
